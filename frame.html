<!doctype html>
<html><head><meta charset="utf-8"><title>frame</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script src="plan.js"></script><script src="radar.js"></script>
<script>
(async () => {
  try {
    const q = new URLSearchParams(location.search);
    const W = +(q.get("w") || 1290), H = +(q.get("h") || 2796);
    const c = document.getElementById("c"); c.width = W; c.height = H;
    await Promise.all(['700 40px "B612"', '400 40px "B612"', '700 40px "B612 Mono"', '400 40px "B612 Mono"'].map((f) => document.fonts.load(f)));
    const skips = {}; (q.get("skip") || "").split(",").filter(Boolean).forEach((d) => (skips[d] = true));
    Radar.draw(c.getContext("2d"), W, H, PLAN, q.get("date") || "2026-11-27", { clock: q.get("clock") === "1", mode: q.get("mode") || "lock", skips });
    window.__png = c.toDataURL("image/png"); window.__ready = true;
  } catch (e) { window.__error = String(e.stack || e); }
})();
</script></body></html>
